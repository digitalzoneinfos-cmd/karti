<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karti · Annuaire intelligent de cartes de visite</title>
<meta name="description" content="Trouvez les meilleurs commerces de votre wilaya grâce à l'IA, ou ajoutez votre carte de visite en 1 minute.">
<meta name="theme-color" content="#0B0E13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Karti">
<meta property="og:title" content="Karti">
<meta property="og:description" content="Toutes les cartes de visite de votre wilaya, trouvées par l'IA.">
<meta property="og:image" content="icons/icon-512.png">
<style>
html{box-sizing:border-box;height:100%;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: phone app (frame on tablet, full-screen on phone); at >=960px a desktop web app with top nav, wide grids and a side drawer */
:root{
  --desk:#05070A;
  --bg:#0B0E13;
  --bg2:#131823;
  --glass:rgba(255,255,255,.055);
  --glass2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.08);
  --fg:#F3F5F9;
  --muted:#8A93A6;
  --dim:#5B6378;
  --a1:#FF7A45;
  --a2:#FFC24B;
  --ai:#2DD4BF;
  --ok:#34D399;
  --bad:#F87171;
  --grad:linear-gradient(120deg,var(--a1),var(--a2));
  --font:"Alexandria","Segoe UI",Tahoma,system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.2,.8,.2,1);
  --top:0px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--fg);font-family:var(--font);display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

.app{overflow:clip;position:relative;width:400px;height:min(860px,calc(100% - 40px));background:var(--bg);border-radius:46px;overflow:hidden;overflow:clip;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 0 9px #161A22,0 40px 100px -30px rgba(255,122,69,.25)}
@media (max-width:520px){.app{width:100%;height:100%;border-radius:0;box-shadow:none}}

.aurora{position:absolute;inset:-20%;pointer-events:none;filter:blur(70px);opacity:.5}
.aurora i{position:absolute;width:55%;aspect-ratio:1;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a1);top:5%;left:-5%}
.aurora i:nth-child(2){background:var(--ai);top:40%;right:-10%;animation-duration:22s;opacity:.6}
.aurora i:nth-child(3){background:#7A3DF0;bottom:-10%;left:20%;animation-duration:26s;opacity:.3}
@keyframes drift{to{transform:translate(18%,-12%) scale(1.15)}}

.screen{position:absolute;inset:var(--top) 0 0 0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(1.02);transition:opacity .4s ease,transform .5s var(--ease);overflow:hidden;overflow:clip;z-index:1}
.screen.on{opacity:1;pointer-events:auto;transform:none;z-index:2}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.scroll{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.wrap{width:100%;max-width:1180px;margin:0 auto}

.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--grad);position:relative;transform:rotate(-8deg);flex:none}
.logo i::after{content:"";position:absolute;inset:7px 6px;border-radius:3px;border:2px solid var(--bg)}

.pill{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:40px;background:var(--glass);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap;transition:transform .25s var(--spring),background .2s,border-color .2s}
.pill:active{transform:scale(.94)}
.pill svg.i{width:16px;height:16px}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill.cta{background:var(--grad);color:#1A0E05;border:0;font-weight:600}
.pill.lg{height:48px;padding:0 22px;font-size:14px}
.pill[disabled]{opacity:.35;pointer-events:none}
.round{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;position:relative;transition:transform .25s var(--spring);flex:none}
.round:active{transform:scale(.88)}
.round svg.i{width:18px;height:18px}
.press{transition:transform .25s var(--spring)}
.press:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
@keyframes bob{50%{translate:0 -9px}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{25%{translate:-6px}75%{translate:6px}}

/* TOPBAR (desktop) */
.topbar{display:none}

/* LANGUAGE */
#s-lang .inner{position:relative;flex:1;display:flex;flex-direction:column;padding-block:60px 30px}
.hello{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1.05;margin-top:auto;height:100px;position:relative}
.hello span{position:absolute;inset:0;opacity:0;transform:translateY(20px);transition:.6s var(--ease)}
.hello span.on{opacity:1;transform:none}
.sub-tri{color:var(--muted);font-size:14px;margin:4px 0 30px}
.langs{display:grid;gap:10px}
.lang{position:relative;display:flex;align-items:center;gap:16px;height:74px;padding:0 20px;border-radius:24px;background:var(--glass);border:1px solid var(--line);text-align:start;overflow:hidden;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .3s var(--spring),border-color .3s;animation:rise .7s backwards var(--ease)}
.lang:nth-child(2){animation-delay:.08s}.lang:nth-child(3){animation-delay:.16s}
.lang:active{transform:scale(.97)}
.lang .g{font-size:28px;font-weight:700;width:44px;text-align:center}
.lang b{flex:1;font-weight:500;font-size:17px}
.lang svg.i{color:var(--muted);transition:transform .3s}
.lang.sel{border-color:var(--a2)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,194,75,.25);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* ONBOARDING */
#s-onb{background:var(--bg)}
.onb-shell{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.tint{position:absolute;inset:0;pointer-events:none;transition:background 1s ease;background:radial-gradient(90% 55% at 50% 22%,var(--tint,rgba(255,122,69,.28)),transparent 70%)}
.segs{display:flex;gap:5px;padding-top:18px;position:relative;z-index:3}
.segs i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.segs i b{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.segs i.done b{width:100%}
.segs i.cur b{animation:seg 5.5s linear forwards}
.segs.paused i.cur b{animation-play-state:paused}
@keyframes seg{to{width:100%}}
.onb-top{display:flex;justify-content:space-between;align-items:center;height:56px;position:relative;z-index:3}
.skip{font-size:13px;color:var(--muted);padding:8px 4px}
.stage{flex:1;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;min-height:0}
.story{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .5s}
.story.on{opacity:1;pointer-events:auto}
.story .art{flex:1;display:grid;place-items:center;min-height:0;perspective:900px;position:relative}
.story .art>*{transform:scale(.9) translateY(20px);opacity:0;transition:transform .9s var(--spring),opacity .6s}
.story.on .art>*{transform:none;opacity:1}
.story .txt{padding-bottom:6px}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
[dir=rtl] .kicker{letter-spacing:0}
.kicker b{color:var(--fg);font-variant-numeric:tabular-nums}
.story h2{font-size:31px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:0 0 12px;text-wrap:balance}
.story h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.story p{margin:0;color:var(--muted);line-height:1.65;font-size:14.5px;max-width:42ch}
.story.on .txt>*{animation:rise .7s backwards var(--ease)}
.story.on .txt h2{animation-delay:.08s}.story.on .txt p{animation-delay:.16s}
.onb-foot{height:96px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:3}
.hint{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;transition:opacity .3s}
.hint svg.i{width:16px;height:16px}
.nxt{position:relative;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;transition:width .45s var(--spring),border-radius .45s;background:var(--fg);color:var(--bg);overflow:hidden;flex:none}
.nxt svg.i{width:22px;height:22px;stroke-width:2.2}
.nxt span{display:none;font-weight:600;font-size:14px;white-space:nowrap}
.nxt.final{width:auto;padding:0 22px;gap:10px;display:inline-flex;align-items:center;border-radius:31px;background:var(--grad);color:#1A0E05}
.nxt.final span{display:inline}
.nxt.final svg.ring{display:none}
.nxt .ring{position:absolute;inset:-1px;width:64px;height:64px;transform:rotate(-90deg)}
.nxt .ring circle{fill:none;stroke:var(--a1);stroke-width:3;stroke-dasharray:195;stroke-dashoffset:195}
.nxt .ring circle.run{animation:ringrun 5.5s linear forwards}
.segs.paused~* .ring circle.run,.paused-ring .ring circle.run{animation-play-state:paused}
@keyframes ringrun{to{stroke-dashoffset:0}}

/* story arts */
.phone-mock{width:200px;height:300px;border-radius:34px;background:#0E1219;border:1px solid rgba(255,255,255,.12);box-shadow:0 40px 80px -30px rgba(0,0,0,.9),inset 0 0 0 6px #171C26;padding:16px 12px;overflow:hidden;position:relative}
.phone-mock::before{content:"";position:absolute;top:12px;left:50%;translate:-50% 0;width:56px;height:6px;border-radius:6px;background:#232937;z-index:2}
.feedcol{display:grid;gap:10px;padding-top:14px;animation:feedup 6s linear infinite}
.feedcol .mc{height:100px;border-radius:14px;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;font-weight:700;position:relative;overflow:hidden}
.feedcol .mc small{font-weight:400;font-size:9.5px;opacity:.85}
.feedcol .mc::after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.18);top:-24px;inset-inline-end:-16px}
@keyframes feedup{to{transform:translateY(-480px)}}
.float-tag{position:absolute;background:rgba(19,24,35,.9);border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:16px;padding:9px 13px;font-size:12px;display:flex;gap:8px;align-items:center;white-space:nowrap;box-shadow:0 14px 30px -12px rgba(0,0,0,.8);animation:bob 3.4s ease-in-out infinite}
.float-tag i{width:8px;height:8px;border-radius:50%;background:var(--a1);box-shadow:0 0 10px var(--a1)}
.map-art{position:relative;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#13302F,#0B0E13 70%);border:1px solid rgba(45,212,191,.2);overflow:hidden}
.map-art .sweep{position:absolute;inset:0;background:conic-gradient(from 0deg,rgba(45,212,191,.45),transparent 80deg);animation:orbit 3s linear infinite;border-radius:50%}
.map-art .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:26px 26px}
.map-art .me{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:var(--ai);box-shadow:0 0 0 8px rgba(45,212,191,.2),0 0 30px var(--ai)}
.map-art .p{position:absolute;width:26px;height:26px;margin:-26px -13px;border-radius:50% 50% 50% 0;transform:rotate(-45deg) scale(0);animation:pinpop .5s var(--spring) forwards}
.map-art .p::after{content:"";position:absolute;inset:8px;border-radius:50%;background:#fff}
@keyframes pinpop{to{transform:rotate(-45deg) scale(1)}}
.rate-art{width:270px;display:grid;gap:10px}
.rcard{border-radius:22px;padding:16px;background:rgba(255,255,255,.06);border:1px solid var(--line);backdrop-filter:blur(16px)}
.rcard .top{display:flex;align-items:center;gap:12px}
.rcard .big{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.rcard .stars{display:flex;gap:3px}
.rcard .stars svg{width:18px;height:18px;fill:rgba(255,255,255,.12);transform:scale(.5)}
.story.on .rcard .stars svg{animation:starpop .5s var(--spring) forwards}
.rcard .stars svg:nth-child(2){animation-delay:.12s!important}.rcard .stars svg:nth-child(3){animation-delay:.24s!important}.rcard .stars svg:nth-child(4){animation-delay:.36s!important}.rcard .stars svg:nth-child(5){animation-delay:.48s!important}
@keyframes starpop{to{fill:var(--a2);transform:scale(1)}}
.rv{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);line-height:1.4}
.rv i{width:32px;height:32px;border-radius:50%;flex:none;background:var(--grad)}
.rv b{display:block;color:var(--fg);font-weight:600;font-size:12.5px}
.rcard.r2{margin-inline-start:30px}.rcard.r2 .rv i{background:linear-gradient(135deg,var(--ai),#1E3A5F)}
.story.on .rcard.r1{animation:rise .7s .3s backwards var(--ease)}
.story.on .rcard.r2{animation:rise .7s .5s backwards var(--ease)}
.two-art{position:relative;width:280px;height:240px}
.two-art .oc{position:absolute;width:190px;border-radius:22px;padding:16px;background:rgba(19,24,35,.92);border:1px solid var(--line);box-shadow:0 30px 60px -24px rgba(0,0,0,.9)}
.two-art .oc .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;margin-bottom:12px}
.two-art .oc b{display:block;font-size:14px;font-weight:600}
.two-art .oc small{color:var(--muted);font-size:11px;line-height:1.4;display:block;margin-top:4px}
.two-art .o1{top:0;inset-inline-start:0;transform:rotate(-6deg)}
.two-art .o1 .ic{background:rgba(45,212,191,.15);color:var(--ai)}
.two-art .o2{bottom:0;inset-inline-end:0;transform:rotate(5deg)}
.two-art .o2 .ic{background:rgba(255,122,69,.15);color:var(--a1)}
.story.on .two-art .o1{animation:rise .7s .2s backwards var(--ease)}
.story.on .two-art .o2{animation:rise .7s .4s backwards var(--ease)}

/* HOME */
.hdr{display:flex;justify-content:space-between;align-items:center;padding-top:18px;height:66px;flex:none;gap:10px}
.hdr .r{display:flex;gap:8px;align-items:center;min-width:0}
.locpill{max-width:170px}
.locpill span{overflow:hidden;text-overflow:ellipsis}
.greet{color:var(--muted);font-size:13px;margin-top:8px}
.hq{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.1;margin:6px 0 0;text-wrap:balance}
.hq em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.searchbar{display:flex;align-items:center;gap:12px;width:100%;height:58px;border-radius:20px;background:var(--glass);border:1px solid var(--line);padding:0 8px 0 18px;margin-top:20px;text-align:start;color:var(--dim);font-size:14.5px;transition:border-color .2s,transform .25s var(--spring)}
[dir=rtl] .searchbar{padding:0 18px 0 8px}
.searchbar:active{transform:scale(.98)}
.searchbar>svg.i{color:var(--a2)}
.searchbar span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbar .go{width:42px;height:42px;border-radius:14px;background:var(--grad);display:grid;place-items:center;color:#1A0E05}
.typer::after{content:"|";color:var(--a2);margin-inline-start:2px;animation:blink 1s steps(1) infinite}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 0 12px}
.sec-h b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.sec-h button{font-size:12.5px;color:var(--muted)}
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px));padding-block:2px 4px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start}
.cat{position:relative;flex:none;width:118px;height:130px;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:start;overflow:hidden;background:var(--glass);border:1px solid var(--line);transition:transform .3s var(--spring)}
.cat:active{transform:scale(.94)}
.cat::before{content:"";position:absolute;inset:0;background:radial-gradient(110% 80% at 100% 0%,var(--c),transparent 65%);opacity:.32}
.cat>*{position:relative}
.cat .ic{width:38px;height:38px;border-radius:12px;background:var(--c);display:grid;place-items:center;color:#fff}
.cat b{font-size:13px;font-weight:600;line-height:1.25}
.cat small{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.banner{position:relative;display:flex;align-items:center;gap:14px;width:100%;margin-top:26px;padding:20px;border-radius:26px;overflow:hidden;text-align:start;background:linear-gradient(135deg,#2A1A12,#171B26 60%);border:1px solid rgba(255,122,69,.25)}
.banner::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:var(--grad);opacity:.25;filter:blur(30px);top:-60px;inset-inline-end:-40px}
.banner .t{flex:1;position:relative;min-width:0}
.banner small{color:var(--a2);font-size:12px;font-weight:600}
.banner b{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.banner p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.banner .mini-cards{position:relative;width:76px;height:76px;flex:none}
.banner .mini-cards i{position:absolute;width:64px;height:40px;border-radius:9px;background:var(--grad);top:6px;inset-inline-start:4px;transform:rotate(-10deg)}
.banner .mini-cards i:nth-child(2){background:#2DD4BF;top:26px;inset-inline-start:10px;transform:rotate(6deg)}
.banner .pill{position:relative;margin-top:12px;height:34px;font-size:12px}
.home-pad{height:120px}
.stats{display:flex;gap:18px;margin-top:16px;font-size:12px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.hero-art{display:none}
.favrow .frc{flex:none;width:220px}
.favrow .frc .vc{border-radius:16px}
.favrow .frc b{display:block;font-size:13px;font-weight:600;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* DOCK (mobile) */
.dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;pointer-events:none;transform:translateY(130%);transition:transform .5s var(--ease)}
.app.dock-on .dock{transform:none}
.dock-in{pointer-events:auto;margin-inline:max(16px,env(safe-area-inset-left,0px));height:70px;border-radius:28px;background:rgba(22,27,38,.82);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 20px 50px -10px rgba(0,0,0,.7)}
.dk{width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);position:relative;transition:color .2s}
.dk svg.i{width:21px;height:21px}
.dk.on{color:var(--fg)}
.dk.on::after{content:"";position:absolute;bottom:-9px;width:4px;height:4px;border-radius:50%;background:var(--a1)}
.dk .dot{position:absolute;top:-5px;inset-inline-end:10px;min-width:16px;height:16px;border-radius:8px;background:var(--a1);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:.3s var(--spring)}
.dk .dot.on{transform:scale(1)}
.dk-orb{width:56px;height:56px;border-radius:50%;margin-top:-30px;position:relative;display:grid;place-items:center}
.dk-orb::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--a1),var(--a2),var(--ai),var(--a1));animation:orbit 3s linear infinite}
.dk-orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A3245,#10141C)}
.dk-orb svg{position:relative;z-index:1;width:24px;height:24px;color:var(--a2)}

/* WIZARD */
.wz-top{display:flex;align-items:center;gap:12px;padding-top:18px;height:66px;flex:none}
.wz-top .t{flex:1}
.wz-top small{display:block;font-size:11.5px;color:var(--muted)}
.wz-prog{display:flex;gap:5px;margin-top:6px}
.wz-prog i{width:28px;height:4px;border-radius:4px;background:var(--glass2);overflow:hidden}
.wz-prog i.on{background:var(--grad)}
.wz-h{font-size:28px;font-weight:700;letter-spacing:-.035em;line-height:1.12;margin:10px 0 6px;text-wrap:balance}
.wz-h em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wz-p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.55}
.field{display:flex;align-items:center;gap:10px;height:54px;border-radius:18px;background:var(--glass);border:1px solid var(--line);padding:0 16px;transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--a2);box-shadow:0 0 0 4px rgba(255,194,75,.1)}
.field svg.i{width:19px;height:19px;color:var(--muted)}
.field input{border:0;background:none;outline:none;flex:1;font-size:15px;min-width:0}
.field input::placeholder{color:var(--dim)}
.field .clr{width:26px;height:26px;border-radius:50%;background:var(--glass2);display:grid;place-items:center}
.field .clr svg.i{width:13px;height:13px}
.sub-h{font-size:12px;font-weight:600;color:var(--muted);margin:22px 0 10px;letter-spacing:.06em;text-transform:uppercase}
[dir=rtl] .sub-h{letter-spacing:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-bottom:30px}
.wb{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:16px;background:var(--glass);border:1px solid transparent;text-align:start;font-size:13.5px;transition:transform .2s var(--spring),background .2s;animation:rise .4s backwards var(--ease)}
.wb:active{transform:scale(.95)}
.wb .n{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;font-weight:600;width:20px}
.wb.sel{background:var(--fg);color:var(--bg)}
.wb.sel .n{color:var(--a1)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13.5px;line-height:1.5}
.empty b{display:block;color:var(--fg);font-size:17px;margin:14px 0 6px}
.empty .eic{width:60px;height:60px;border-radius:20px;background:var(--glass);display:grid;place-items:center;margin:0 auto}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:150px}
.tile{position:relative;min-height:112px;border-radius:20px;background:var(--glass);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:12px;text-align:start;overflow:hidden;transition:transform .3s var(--spring),border-color .3s;animation:rise .45s backwards var(--ease)}
.tile:active{transform:scale(.93)}
.tile .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.07);transition:.35s var(--spring)}
.tile .ic svg.i{width:18px;height:18px}
.tile b{font-size:12px;font-weight:600;line-height:1.25;display:block}
.tile small{display:block;font-size:10px;color:var(--ai);margin-top:3px;line-height:1.3}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 0%,var(--c),transparent 60%);opacity:0;transition:opacity .35s}
.tile.sel{border-color:var(--c)}
.tile.sel::before,.tile.hit::before{opacity:.32}
.tile.sel .ic{background:var(--c);color:#fff;transform:rotate(-10deg) scale(1.12)}
.tile>*{position:relative}
mark{background:rgba(255,194,75,.25);color:var(--fg);border-radius:4px;padding:0 2px}
.launch{position:absolute;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.launch-in{pointer-events:auto;margin-inline:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:30px;background:rgba(22,27,38,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 20px 50px -10px rgba(0,0,0,.7);transform:translateY(140%);transition:transform .5s var(--spring)}
[dir=rtl] .launch-in{padding:10px 18px 10px 10px}
.launch.on .launch-in{transform:none}
.launch .t{flex:1;min-width:0}
.launch .t small{display:block;font-size:11px;color:var(--muted)}
.launch .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orb-btn{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--spring);touch-action:none;flex:none}
.orb-btn::before{content:"";position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(var(--a1),var(--a2),var(--ai),var(--a1));animation:orbit 3s linear infinite}
.orb-btn::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A3245,#10141C)}
.orb-btn>svg.i{position:relative;z-index:1;width:24px;height:24px;color:var(--a2)}
.orb-btn .fill{position:absolute;inset:-5px;width:70px;height:70px;z-index:2;transform:rotate(-90deg)}
.orb-btn .fill circle{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-dasharray:214;stroke-dashoffset:214}
.orb-btn.holding{transform:scale(.88)}
.orb-btn{animation:beat 1.8s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.06)}}

/* AI SCAN */
#s-ai{background:radial-gradient(90% 60% at 50% 38%,#0F2A2C,var(--bg) 70%);align-items:center}
#aiCanvas{position:absolute;inset:0;width:100%;height:100%}
.ai-ui{position:relative;margin-top:auto;width:100%;max-width:440px;padding-bottom:50px}
.pct{font-size:64px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.pct small{font-size:24px;color:var(--muted)}
.ai-lbl{text-align:center;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ai);margin:8px 0 22px;font-weight:600}
[dir=rtl] .ai-lbl{letter-spacing:0}
.steps{display:grid;gap:4px;max-width:320px;margin:0 auto}
.stp{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);height:34px;opacity:.35;transition:opacity .4s,color .4s}
.stp .b{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.stp.act{opacity:1;color:var(--fg)}
.stp.act .b{border-color:var(--ai);border-top-color:transparent;animation:orbit .8s linear infinite}
.stp.done{opacity:1;color:var(--fg)}
.stp.done .b{background:var(--ai);border-color:var(--ai)}
.stp.done .b::after{content:"";width:5px;height:9px;border:solid #06201D;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.stp em{font-style:normal;margin-inline-start:auto;font-size:12px;color:var(--ai);font-variant-numeric:tabular-nums}
.flash{position:absolute;inset:0;background:radial-gradient(circle,#fff,var(--ai) 40%,transparent 70%);opacity:0;pointer-events:none;z-index:9}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0;transform:scale(.2)}40%{opacity:.9}100%{opacity:0;transform:scale(2.5)}}

/* RESULTS */
.res-hd{flex:none;padding-top:16px}
.res-top{display:flex;align-items:center;gap:10px;height:46px}
.res-top .t{flex:1;min-width:0}
.res-top .t b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-top .t span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.res-top .t span i{width:6px;height:6px;border-radius:50%;background:var(--ai);box-shadow:0 0 8px var(--ai);flex:none}
.seg2{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:30px;padding:3px}
.seg2 button{width:36px;height:32px;border-radius:30px;display:grid;place-items:center;color:var(--muted);transition:.25s}
.seg2 button svg.i{width:17px;height:17px}
.seg2 button.on{background:var(--fg);color:var(--bg)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:12px 8px}
.filters::-webkit-scrollbar{display:none}
.ai-note{display:none}
.feed{flex:1;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.fi{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;position:relative;padding-block:8px 20px}
.fi-card{flex:1;display:grid;place-items:center;perspective:1000px;min-height:0}
.float{width:100%;animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.tilt{transition:transform .5s var(--ease);transform-style:preserve-3d;position:relative;border-radius:18px;box-shadow:0 40px 70px -30px rgba(0,0,0,.9);cursor:pointer}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.28),transparent 45%);pointer-events:none;mix-blend-mode:overlay}
.fi-bot{display:flex;gap:14px;align-items:flex-end}
.fi-info{flex:1;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:20px;font-size:11.5px;font-weight:500;background:var(--glass);border:1px solid var(--line);white-space:nowrap}
.tag svg.i{width:13px;height:13px}
.tag.ai{background:rgba(45,212,191,.12);border-color:rgba(45,212,191,.35);color:var(--ai)}
.tag.open{color:var(--ok)}
.tag.closed{color:var(--bad)}
.fi-info h3{margin:0;font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;gap:4px;align-items:center}
.meta svg.i{width:14px;height:14px}
.meta b{color:var(--fg);font-weight:600}
.st5{display:inline-flex;gap:1px}
.st5 svg{width:12px;height:12px}
.rail{display:flex;flex-direction:column;gap:12px;align-items:center}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.rb .round{width:46px;height:46px;background:rgba(255,255,255,.08)}
.rb .round svg.i{width:20px;height:20px;color:var(--fg)}
.liked .round{background:rgba(255,122,69,.18)!important;border-color:rgba(255,122,69,.5)!important}
.liked svg.i{fill:var(--a1);stroke:var(--a1)!important;color:var(--a1)!important;animation:heart .5s var(--spring)}
@keyframes heart{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.swipe-hint{position:absolute;bottom:0;left:50%;translate:-50% 0;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;animation:nudge 1.6s ease-in-out infinite;white-space:nowrap}
.swipe-hint svg.i{width:14px;height:14px}
@keyframes nudge{50%{transform:translateY(-5px)}}
.burst{position:absolute;pointer-events:none;z-index:50}
.burst i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--a1);animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.list{display:grid;gap:10px;padding-block:6px 30px}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:22px;background:var(--glass);border:1px solid var(--line);text-align:start;width:100%;animation:rise .5s backwards var(--ease);transition:transform .25s var(--spring)}
.row:active{transform:scale(.97)}
.mini{width:118px;height:74px;flex:none;border-radius:11px;overflow:hidden;position:relative}
.mini>.vc{width:300px;transform:scale(.3934);transform-origin:0 0;position:absolute;top:0;left:0}
[dir=rtl] .mini>.vc{left:auto;right:0;transform-origin:100% 0}
.row .t{flex:1;min-width:0}
.row b{font-size:14.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{margin-top:5px;font-size:11.5px}
.row .sc{font-size:12px;color:var(--ai);font-weight:600;white-space:nowrap}
.ggrid{display:none}

/* visiting card */
.vc{position:relative;aspect-ratio:1.72;width:100%;max-width:100%;border-radius:18px;overflow:hidden;color:#fff;display:flex;font-family:var(--font)}
.vc .nm{font-weight:700;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.vc .tel{font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.vc .tel s{text-decoration:none;filter:blur(4px)}
.vc .ico{display:grid;place-items:center}
.vc .ico svg{stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.t1{background:#FBFAF7;color:var(--c1)}
.t1 .l{width:36%;background:var(--c1);color:#fff;clip-path:polygon(0 0,100% 0,76% 100%,0 100%)}
[dir=rtl] .t1 .l{clip-path:polygon(0 0,100% 0,100% 100%,24% 100%)}
.t1 .l svg{width:54px;height:54px}
.t1 .r{flex:1;padding:18px 18px 16px 6px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
[dir=rtl] .t1 .r{padding:18px 6px 16px 18px}
.t1 .nm{font-size:21px;color:#141821}
.t1 .sl{font-size:11px;color:#6D7480}
.t1 .tel{margin-top:8px;font-size:15px;color:var(--c1)}
.t2{background:var(--c1);flex-direction:column;justify-content:flex-end;padding:18px 20px}
.t2::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:var(--c2);top:-90px;inset-inline-end:-60px;opacity:.85}
.t2::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;border:16px solid rgba(255,255,255,.12);bottom:-60px;inset-inline-start:-30px}
.t2 .ico{position:absolute;top:22px;inset-inline-end:26px;color:#fff;z-index:1}
.t2 .ico svg{width:46px;height:46px}
.t2 .nm{font-size:25px;position:relative;max-width:80%;z-index:1}
.t2 .rw{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;position:relative;z-index:1;gap:8px}
.t2 .tel{font-size:14px;background:rgba(0,0,0,.25);padding:5px 10px;border-radius:8px}
.t3{background:#F4F1EA;color:#141821;flex-direction:column}
.t3 .band{height:30%;background:var(--c1);display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;font-size:11px;font-weight:600}
.t3 .band svg{width:20px;height:20px}
.t3 .body{flex:1;padding:12px 18px;display:flex;flex-direction:column;justify-content:center;background-image:radial-gradient(var(--c2) 1.1px,transparent 1.5px);background-size:13px 13px;background-position:right}
.t3 .nm{font-size:22px;color:var(--c1)}
.t3 .sl{font-size:11px;color:#6D7480;margin-top:4px}
.t3 .tel{font-size:15px;margin-top:9px}
.t4{background:#12151B;padding:18px 20px;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 2px var(--c2)}
.t4 .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t4 .nm{font-size:22px;color:var(--c2)}
.t4 .ico{width:46px;height:46px;border-radius:14px;background:var(--c1);flex:none}
.t4 .ico svg{width:26px;height:26px}
.t4 .sl{font-size:11px;color:#9AA3B2}
.t4 .tel{font-size:16px}
.vc.photo{background:#000;aspect-ratio:1.6}
.feedcol img{width:100%;border-radius:12px;display:block;box-shadow:0 12px 24px -12px #000}
.demo-dot{font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:8px;background:rgba(45,212,191,.15);color:var(--ai);margin-inline-start:2px}
.vc.photo img{width:100%;height:100%;object-fit:cover}

/* SHEETS */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.35s;z-index:20;backdrop-filter:blur(3px)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;inset:auto 0 0;max-height:90%;background:var(--bg2);border-radius:30px 30px 0 0;border-top:1px solid var(--line);z-index:21;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.grab{flex:none;padding:10px 0 6px;touch-action:none;cursor:grab}
.grab::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:rgba(255,255,255,.2);margin:0 auto}
.sheet-x{display:none}
.sheet h3{margin:6px 0 14px;font-size:20px;font-weight:700;letter-spacing:-.02em}
.det{overflow-y:auto;padding-bottom:26px;scrollbar-width:none;flex:1;min-height:0}
.flipper{perspective:1200px;margin-top:4px}
.flip-in{position:relative;transition:transform .8s var(--ease);transform-style:preserve-3d;cursor:pointer}
.flip-in.back{transform:rotateY(180deg)}
.flip-in>.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;overflow:hidden}
.flip-in>.face.b{position:absolute;inset:0;transform:rotateY(180deg);background:linear-gradient(135deg,#1A2030,#0E1118);border:1px solid var(--line);display:flex;gap:16px;align-items:center;padding:18px}
.qr{width:96px;height:96px;flex:none;background:#fff;border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(11,1fr);gap:1px}
.qr i{background:#111;border-radius:1px}
.qr i.o{background:transparent}
.face.b .t{font-size:12px;color:var(--muted);line-height:1.6;min-width:0}
.face.b .t b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.fliphint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.fliphint svg.i{width:13px;height:13px}
.det h3{margin:18px 0 0;font-size:24px;letter-spacing:-.025em}
.acts{display:flex;justify-content:space-between;margin:18px 0}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted);flex:1}
.act .round{width:50px;height:50px}
.act:first-child .round{background:var(--grad);border:0;color:#1A0E05}
.numrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);margin-bottom:12px;animation:rise .4s}
.numrow b{font-size:19px;direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums}
.numrow small{display:block;font-size:11px;color:var(--muted)}
.map{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#0F141C;margin-bottom:12px}
.map svg{display:block;width:100%;height:auto}
.map .route{stroke-dasharray:6 6;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.why{border-radius:20px;padding:16px;background:linear-gradient(135deg,rgba(45,212,191,.12),rgba(45,212,191,.03));border:1px solid rgba(45,212,191,.25)}
.why h4{margin:0 0 12px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;color:var(--ai)}
.why h4 svg.i{width:16px;height:16px}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px}
.bar i{grid-column:1/-1;height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i b{display:block;height:100%;border-radius:5px;background:var(--ai);width:0;transition:width 1s var(--ease) .3s}
.bar em{font-style:normal;color:var(--ai);font-variant-numeric:tabular-nums}
.info{margin-top:12px}
.info div{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:center}
.info svg.i{width:18px;height:18px;color:var(--a2)}
.langs-mini{display:flex;gap:8px;margin-bottom:12px}
.langs-mini .pill{flex:1;justify-content:center;height:46px}
.set-row{display:flex;align-items:center;gap:12px;width:100%;padding:15px 2px;border-bottom:1px solid var(--line);font-size:14px;text-align:start}
.set-row svg.i{color:var(--a2)}
.demo{font-size:11px;color:var(--muted);text-align:center;padding:16px 0 22px}

/* ADD FLOW */
.add-hd{flex:none;padding-top:18px}
.add-top{display:flex;align-items:center;gap:12px;height:48px}
.add-top b{font-size:17px;font-weight:600;flex:1}
.aprog{display:flex;gap:6px;margin:12px 0 4px}
.aprog div{flex:1;min-width:0}
.aprog i{display:block;height:4px;border-radius:4px;background:var(--glass2);overflow:hidden}
.aprog i b{display:block;height:100%;width:0;background:var(--grad);transition:width .5s var(--ease)}
.aprog .done i b,.aprog .cur i b{width:100%}
.aprog span{display:block;font-size:10.5px;color:var(--dim);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aprog .cur span,.aprog .done span{color:var(--fg)}
.aprog.hidden{visibility:hidden}
.add-body{flex:1;min-height:0;display:flex;flex-direction:column}
.add-grid{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.add-grid::-webkit-scrollbar{display:none}
.add-side{display:none;padding-top:8px}
#s-add[data-show-prev="1"] .add-side{display:block;position:sticky;top:0;z-index:2;background:linear-gradient(var(--bg) 85%,transparent);padding-bottom:12px}
.prev-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.prev-lbl i{font-style:normal;display:flex;align-items:center;gap:5px}
.prev-lbl i::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.4s infinite}
.side-sum{display:none}
.mob-side .tilt{max-width:100%;margin:0 auto;transition:max-width .35s var(--ease)}
#s-add.compact .mob-side .tilt{max-width:68%}
.desk-side{display:none!important}
.astep{display:none;padding-bottom:20px;animation:stepin .5s var(--ease)}
.astep.on{display:block}
@keyframes stepin{from{opacity:0;transform:translateX(24px)}}
[dir=rtl] .astep{animation-name:stepinr}
@keyframes stepinr{from{opacity:0;transform:translateX(-24px)}}
.ah{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.12;margin:16px 0 6px;text-wrap:balance}
.ap{color:var(--muted);font-size:13.5px;margin:0 0 20px;line-height:1.55}
.opt{position:relative;display:flex;gap:16px;align-items:flex-start;width:100%;padding:20px;border-radius:26px;background:var(--glass);border:1px solid var(--line);text-align:start;margin-bottom:12px;overflow:hidden;transition:transform .3s var(--spring),border-color .3s;animation:rise .55s backwards var(--ease)}
.opt:nth-child(2){animation-delay:.08s}
.opt:active{transform:scale(.97)}
.opt:hover{border-color:rgba(255,255,255,.18)}
.opt .ic{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;flex:none}
.opt .ic svg.i{width:24px;height:24px}
.opt.o1 .ic{background:rgba(45,212,191,.14);color:var(--ai)}
.opt.o2 .ic{background:rgba(255,122,69,.14);color:var(--a1)}
.opt .t{flex:1;min-width:0}
.opt b{display:block;font-size:16px;font-weight:600;margin-top:2px}
.opt p{margin:5px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.opt .chev{color:var(--dim);align-self:center}
.opt .badges{display:flex;gap:6px;margin-top:10px}
.opt .badges span{font-size:10.5px;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--muted)}
.src{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srcb{position:relative;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:22px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:transform .3s var(--spring)}
.srcb:active{transform:scale(.95)}
.srcb .round{width:46px;height:46px;background:rgba(255,255,255,.08)}
.srcb b{font-size:14px;font-weight:600}
.srcb small{font-size:11.5px;color:var(--muted);margin-top:-6px}
.srcb input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.photo-box{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1.72;background:#000;margin-top:4px}
.photo-box img{width:100%;height:100%;object-fit:cover;display:block}
.photo-box .scanl{position:absolute;left:0;right:0;height:3px;background:var(--ai);box-shadow:0 0 18px 4px var(--ai);top:0;animation:scanl 1.2s ease-in-out infinite alternate}
@keyframes scanl{to{top:calc(100% - 3px)}}
.photo-box .corners{position:absolute;inset:10px;border-radius:14px;background:linear-gradient(var(--ai),var(--ai)) top left/22px 3px,linear-gradient(var(--ai),var(--ai)) top left/3px 22px,linear-gradient(var(--ai),var(--ai)) top right/22px 3px,linear-gradient(var(--ai),var(--ai)) top right/3px 22px,linear-gradient(var(--ai),var(--ai)) bottom left/22px 3px,linear-gradient(var(--ai),var(--ai)) bottom left/3px 22px,linear-gradient(var(--ai),var(--ai)) bottom right/22px 3px,linear-gradient(var(--ai),var(--ai)) bottom right/3px 22px;background-repeat:no-repeat}
.scanmsg{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted);min-height:22px}
.scanmsg.ok{color:var(--ok)}
.scanmsg .sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--ai);border-top-color:transparent;animation:orbit .8s linear infinite}
.linkb{font-size:12.5px;color:var(--a2);margin-top:10px;display:inline-flex;gap:6px;align-items:center}
.fl{margin-top:16px}
.fl label,.fl .lab{display:block;font-size:12px;color:var(--muted);margin-bottom:8px;font-weight:500}
.inp{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--glass);padding:0 16px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp:focus{border-color:var(--a2);box-shadow:0 0 0 4px rgba(255,194,75,.1)}
.inp::placeholder{color:var(--dim)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px;background-repeat:no-repeat}
[dir=rtl] select.inp{background-position:22px 50%,16px 50%}
select.inp option{background:var(--bg2)}
.catpick{position:relative}
.catdrop{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.catdrop .pill{height:34px;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .fl{min-width:0}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:52px;height:52px;border-radius:15px;border:2px solid transparent;transition:transform .25s var(--spring),border-color .2s;position:relative;overflow:hidden}
.sw.on{border-color:var(--fg);transform:scale(1.08)}
.sw i{position:absolute;inset:3px;border-radius:11px}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.col{width:36px;height:36px;border-radius:50%;border:3px solid transparent;transition:transform .25s var(--spring);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.col.on{border-color:var(--fg);transform:scale(1.12)}
.pw{position:relative}
.pw .inp{padding-inline-end:90px}
.pw button{position:absolute;inset-inline-end:8px;top:8px;height:36px;padding:0 12px;border-radius:12px;font-size:12px;color:var(--muted);background:var(--glass)}
.strength{display:flex;gap:5px;margin-top:8px;align-items:center;font-size:11px;color:var(--muted)}
.strength i{flex:1;height:4px;border-radius:4px;background:var(--glass2);transition:background .3s}
.strength span{width:60px;text-align:end}
.check{display:flex;gap:12px;align-items:center;margin-top:18px;font-size:13px;color:var(--muted);cursor:pointer;text-align:start}
.check .bx{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;transition:.25s var(--spring)}
.check.on .bx{background:var(--grad);border-color:transparent;transform:scale(1.05)}
.check .bx svg.i{width:14px;height:14px;color:#1A0E05;stroke-width:3;opacity:0}
.check.on .bx svg.i{opacity:1}
.sum{border-radius:22px;padding:16px;background:var(--glass);border:1px solid var(--line)}
.sum .line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;color:var(--muted)}
.sum .line b{color:var(--fg);font-weight:500;text-align:end}
.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:14px;font-size:15px;color:var(--fg)}
.sum .tot b{font-size:20px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pms{display:grid;gap:8px}
.pm{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--glass);border:1px solid var(--line);text-align:start;transition:border-color .2s,transform .25s var(--spring)}
.pm:active{transform:scale(.98)}
.pm .lg{width:46px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:.02em;flex:none}
.pm .t{flex:1;min-width:0}
.pm b{display:block;font-size:14px;font-weight:600}
.pm small{font-size:11.5px;color:var(--muted)}
.pm .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;transition:.25s var(--spring)}
.pm.on{border-color:var(--a2)}
.pm.on .rd{border:7px solid var(--a2)}
.proto{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:14px}
.proto svg.i{width:15px;height:15px;color:var(--a2)}
.err{color:var(--bad);font-size:12.5px;min-height:18px;margin:12px 2px 0}
.afoot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 22px;border-top:1px solid var(--line);background:var(--bg)}
.afoot .note{font-size:11.5px;color:var(--muted);min-width:0}
.slider{position:relative;height:58px;border-radius:30px;background:var(--glass);border:1px solid var(--line);overflow:hidden;user-select:none;-webkit-user-select:none;flex:1}
.slider .lab{position:absolute;inset:0;display:grid;place-items:center;font-size:13.5px;font-weight:500;background:linear-gradient(90deg,var(--muted) 40%,#fff 50%,var(--muted) 60%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s linear infinite;padding-inline:60px 10px}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.slider .trail{position:absolute;top:0;bottom:0;inset-inline-start:0;width:58px;background:var(--grad);opacity:.25;border-radius:30px}
.knob{position:absolute;top:4px;inset-inline-start:4px;width:50px;height:50px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#1A0E05;touch-action:none;cursor:grab;box-shadow:0 6px 20px -4px rgba(255,122,69,.6)}
.knob svg.i{stroke-width:2.2}
.proc{position:absolute;inset:0;z-index:8;background:rgba(11,14,19,.92);backdrop-filter:blur(8px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;text-align:center}
.proc.on{opacity:1;pointer-events:auto}
.proc .lock{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;position:relative}
.proc .lock::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--glass2);border-top-color:var(--a2);animation:orbit .9s linear infinite}
.proc .lock svg.i{width:30px;height:30px;color:var(--a2)}
.proc b{display:block;font-size:16px;font-weight:600}
.proc small{color:var(--muted);font-size:12px}

/* DONE */
#s-done{align-items:center;justify-content:center;text-align:center}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.done-in{position:relative;width:100%;max-width:420px}
.done-card{width:250px;margin:0 auto;transform:rotate(-5deg);animation:landing 1s var(--spring)}
@keyframes landing{from{transform:translateY(-120%) rotate(20deg) scale(.6);opacity:0}}
.okb{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:20px;background:rgba(52,211,153,.12);color:var(--ok);font-size:12px;margin-top:30px;font-weight:500}
#s-done h2{font-size:28px;margin:14px 0 8px;letter-spacing:-.03em}
#s-done p{color:var(--muted);line-height:1.6;margin:0 auto 18px;max-width:300px;font-size:14px}
.receipt{display:flex;justify-content:center;gap:20px;font-size:12px;color:var(--muted);margin-bottom:24px}
.receipt b{unicode-bidi:plaintext;white-space:nowrap;display:block;color:var(--fg);font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}

.toast{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:50%;translate:-50% -140px;z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:30px;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center;transition:translate .45s var(--spring);white-space:nowrap}
.toast.on{translate:-50% 0}
.toast svg.i{width:16px;height:16px;color:var(--ok)}

/* ============ DESKTOP ============ */
@media (min-width:960px){
  body{display:block}
  .app{width:100%;height:100%;border-radius:0;box-shadow:none;--top:68px}
  .app.bare{--top:0px}
  .pad{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  .topbar{display:flex;position:absolute;top:0;left:0;right:0;height:68px;z-index:10;border-bottom:1px solid var(--line);background:rgba(11,14,19,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .app.bare .topbar{display:none}
  .topbar .wrap{display:flex;align-items:center;gap:28px}
  .topbar nav{display:flex;gap:4px;flex:1}
  .topbar nav button{height:38px;padding:0 14px;border-radius:12px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px;transition:color .2s,background .2s}
  .topbar nav button:hover{color:var(--fg);background:var(--glass)}
  .topbar nav button.on{color:var(--fg);background:var(--glass)}
  .topbar nav .cnt{min-width:18px;height:18px;border-radius:9px;background:var(--a1);color:#fff;font-size:10px;font-weight:700;display:none;place-items:center;padding:0 5px}
  .topbar nav .cnt.on{display:grid}
  .topbar .tr{display:flex;gap:8px;align-items:center}
  .seg-l{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:30px;padding:3px}
  .seg-l button{height:30px;padding:0 12px;border-radius:30px;font-size:12px;color:var(--muted)}
  .seg-l button.on{background:var(--fg);color:var(--bg)}
  .dock,.mob-only{display:none!important}

  /* lang */
  #s-lang .inner{max-width:520px;margin:0 auto;width:100%;justify-content:center;padding-block:40px}
  .hello{margin-top:40px;font-size:60px;height:120px}

  /* onboarding: centered split card */
  #s-onb{align-items:center;justify-content:center;background:radial-gradient(60% 60% at 50% 40%,#151A26,var(--bg))}
  .onb-shell{flex:none;width:min(1000px,92vw);height:min(620px,86vh);border-radius:34px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;box-shadow:0 60px 120px -40px rgba(0,0,0,.9);display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:auto auto 1fr auto}
  .onb-shell .tint{inset:0 auto 0 0;width:52.5%}
  [dir=rtl] .onb-shell .tint{inset:0 0 0 auto}
  .onb-shell .segs{grid-column:2;grid-row:1;padding:28px 36px 0}
  .onb-shell .onb-top{grid-column:2;grid-row:2;padding:0 36px}
  .onb-shell .stage{grid-column:1/-1;grid-row:1/-1;padding:0}
  .story{display:grid;grid-template-columns:1.05fr 1fr}
  .story .art{grid-column:1}
  .story .txt{grid-column:2;align-self:center;padding:0 48px}
  .story h2{font-size:40px}
  .story p{font-size:15.5px}
  .onb-shell .onb-foot{grid-column:2;grid-row:4;padding:0 36px 28px}
  .phone-mock{transform:scale(1.15)}
  .story.on .phone-mock{transform:scale(1.15)}
  .hint .mob{display:none}

  /* home */
  .hdr{display:none}
  #s-home .scroll{padding-top:48px}
  .home-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
  .hq{font-size:54px;max-width:13ch}
  .greet{font-size:15px}
  .searchbar{height:66px;max-width:560px;font-size:16px;border-radius:22px}
  .searchbar .go{width:50px;height:50px}
  .hero-art{display:block;position:relative;height:420px;perspective:1200px}
  .hero-art .hc{position:absolute;width:300px;transition:transform .6s var(--ease)}
  .hero-art .hc:nth-child(1){top:0;inset-inline-start:10px;transform:rotate(-9deg)}
  .hero-art .hc:nth-child(2){top:95px;inset-inline-start:150px;transform:rotate(4deg);z-index:2}
  .hero-art .hc:nth-child(3){top:205px;inset-inline-start:30px;transform:rotate(-3deg)}
  .hero-art:hover .hc:nth-child(1){transform:rotate(-14deg) translate(-20px,-10px)}
  .hero-art:hover .hc:nth-child(3){transform:rotate(2deg) translate(-10px,20px)}
  .hero-art .hc .vc{box-shadow:0 40px 70px -30px rgba(0,0,0,.9)}
  .hero-art .float-tag{z-index:3}
  .hscroll{display:grid;grid-template-columns:repeat(6,1fr);overflow:visible;margin-inline:0;padding-inline:0}
  .cat{width:auto;height:150px}
  .home-lower.has-fav{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start;margin-top:12px}
  .banner{margin-top:40px}
  .favrow{display:grid!important;grid-template-columns:1fr 1fr;overflow:visible;margin-inline:0;padding-inline:0}
  .favrow .frc{width:auto}
  .home-pad{height:60px}

  /* wizard */
  .wz-top{max-width:900px;margin:0 auto;width:100%;padding-top:28px;height:auto}
  .wz-body{max-width:900px;margin:0 auto;width:100%}
  .wz-h{font-size:40px}
  .wgrid{grid-template-columns:repeat(4,1fr)}
  .bento{grid-template-columns:repeat(4,1fr);padding-bottom:140px}
  .tile{min-height:128px}
  .launch-in{max-width:560px;margin:0 auto}

  /* results */
  .res-hd .wrap,.res-body{max-width:1180px;margin:0 auto;width:100%}
  .seg2{display:none}
  .feed,.res-list-wrap{display:none!important}

  .ai-note{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);padding:12px 16px;border-radius:16px;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.2);margin-bottom:16px}
  .ai-note svg.i{color:var(--ai)}
  .ai-note b{color:var(--fg)}
  .gc{display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:26px;background:var(--glass);border:1px solid var(--line);animation:rise .5s backwards var(--ease);transition:border-color .25s,transform .35s var(--ease)}
  .gc:hover{border-color:rgba(255,255,255,.18);transform:translateY(-4px)}
  .gc .perspective{perspective:1000px}
  .gc h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
  .gc .tags{margin:0}
  .gc .row-a{display:flex;gap:8px;align-items:center;margin-top:auto}
  .gc .row-a .pill{flex:1;justify-content:center}
  .gc .rb .round{width:38px;height:38px}

  /* sheets → drawer / modal */
  .sheet{inset:0 0 0 auto;width:460px;max-height:none;height:100%;border-radius:0;border-top:0;border-inline-start:1px solid var(--line);transform:translateX(105%)}
  [dir=rtl] .sheet{inset:0 auto 0 0;transform:translateX(-105%)}
  .sheet.on{transform:none}
  .grab{display:none}
  .sheet-x{display:grid;position:absolute;top:18px;inset-inline-end:22px;z-index:3}
  #dSheet .det{padding-top:64px}
  #setSheet{inset:50% auto auto 50%;width:420px;height:auto;border-radius:26px;border:1px solid var(--line);transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .3s;padding:24px 24px 0}
  #setSheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}

  /* fav */
  #s-fav .list{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
  .fav-wrap{max-width:1180px;margin:0 auto;width:100%}

  /* add flow */

fr:{terms:{t:"Conditions d'utilisation",s:[
["1. Acceptation","<p>En utilisant Karti, en créant un compte ou en envoyant une demande payante, vous acceptez les présentes conditions qui vous concernent. Si vous ne les acceptez pas, ne créez pas de compte et n'utilisez pas les fonctions qui en nécessitent un.</p>"],
["2. Définitions","<ul><li><b>Plateforme</b> : le site web, l'application web installable et toute version officielle publiée sur les magasins d'applications.</li><li><b>Contenu</b> : fiches, images, annonces, avis, signalements, textes et liens publiés par les utilisateurs ou par Karti.</li></ul>"],
["3. Visiteurs et comptes","<p>Vous pouvez consulter et rechercher les fiches publiques sans compte. Un compte est nécessaire pour enregistrer des fiches, laisser un avis, signaler un contenu ou gérer une fiche professionnelle ou une annonce.</p><ul><li>Vous devez fournir des informations exactes et garder votre mot de passe confidentiel.</li><li>Vous êtes responsable de l'activité de votre session jusqu'à ce que vous signaliez une violation ou changiez votre mot de passe.</li><li>L'usurpation d'identité et la manipulation des avis sont interdites.</li></ul>"],
["4. Fiches professionnelles et abonnements","<p>Karti est un annuaire : il n'est pas partie aux accords conclus entre les professionnels et leurs clients. Le titulaire d'une fiche est responsable de l'exactitude de ses informations et des autorisations nécessaires à son activité.</p><p>L'abonnement donne une visibilité à la fiche pendant la durée affichée avant le paiement. Le prix et la durée affichés au moment de la commande s'appliquent.</p>"],
["5. Annonces, paiements et remboursements","<ul><li>Les annonces doivent être licites et exactes ; l'annonceur doit détenir les droits sur les images, textes et liens utilisés. Karti peut refuser ou suspendre une annonce.</li><li>Chaque paiement est vérifié avant l'activation de la fiche. Karti ne collecte ni ne conserve les numéros complets de carte bancaire.</li><li>Un paiement n'est en principe pas remboursable une fois la période de visibilité commencée, sauf erreur manifeste de Karti ou obligation légale.</li><li>La suppression du compte met fin immédiatement aux fiches et campagnes, sans remboursement de la période restante.</li></ul>"],
["6. Avis, signalements et contenus","<p>Vous restez propriétaire de vos contenus et accordez à Karti une licence non exclusive et gratuite, pour la durée de leur présence, afin de les stocker, les afficher, les indexer et faire fonctionner le service.</p><ul><li>Un avis doit refléter une expérience réelle, sans diffamation, menace ni information sensible.</li><li>Les contenus illicites, trompeurs, haineux, pornographiques ou contrefaisants sont interdits.</li><li>L'équipe peut examiner les signalements, masquer un contenu, avertir un utilisateur, restreindre un compte ou supprimer un contenu.</li></ul>"],
["7. Autorisations de l'application","<ul><li><b>Localisation</b> : demandée uniquement pour la recherche à proximité ou la saisie de l'adresse d'un commerce.</li><li><b>Notifications</b> : facultatives.</li><li><b>Photos et appareil photo</b> : utilisés uniquement lorsque vous choisissez d'importer ou de scanner votre carte.</li><li>Aucun accès au microphone ni aux contacts.</li></ul>"],
["8. Responsabilité","<p>Karti affiche les informations des professionnels telles qu'elles sont fournies et ne garantit ni la qualité de leur travail ni l'exécution de leurs engagements. Vérifiez le professionnel avant de payer ou de contracter.</p>"],
["9. Droit applicable et litiges","<p>Les présentes conditions sont régies par le droit algérien. Tout litige est d'abord réglé à l'amiable, puis porté devant les juridictions ou autorités algériennes compétentes, sauf disposition impérative contraire.</p>"],
["10. Contact","<p>Le service est exploité par l'équipe de gestion de Karti. Les coordonnées de contact sont indiquées dans l'application.</p>"]]},
privacy:{t:"Politique de confidentialité",s:[
["1. Responsable et finalités","<p>Karti est responsable du traitement de vos données. Elles sont traitées pour fournir le service, avec votre consentement lorsqu'il est requis, pour protéger la plateforme et prévenir la fraude, et pour respecter nos obligations légales.</p><p>Karti ne vend ni ne loue vos données personnelles et ne les utilise pas pour du suivi publicitaire entre sites.</p>"],
["2. Données collectées","<ul><li>Données de compte et d'identité.</li><li>Informations des fiches professionnelles affichées dans l'annuaire.</li><li>Contenus et interactions : avis, signalements, fiches enregistrées.</li><li>Données d'annonces et d'abonnement.</li><li>Localisation, uniquement si vous choisissez la recherche à proximité ou saisissez une adresse.</li><li>Données de sécurité et d'appareil : sessions, limites de tentatives, journaux de consentement.</li><li>Statistiques internes d'usage : vues, clics et actions de contact.</li></ul>"],
["3. Lecture de carte par IA","<p>Lorsque vous scannez votre carte de visite, l'image peut être analysée par un service d'intelligence artificielle, après votre accord, uniquement pour pré-remplir vos informations. Vous pouvez toujours saisir vos informations à la main.</p>"],
["4. Hébergement et prestataires","<p>Vos données sont traitées par des prestataires techniques : base de données, stockage des images, hébergement, sécurisation de la connexion, envoi d'e-mails de service, notifications (après consentement) et cartes lorsque nécessaire.</p>"],
["5. Cookies et stockage local","<p>Un cookie de session nécessaire est utilisé pour la connexion. Le stockage local de votre navigateur conserve des préférences d'interface : langue, favoris, brouillons.</p>"],
["6. Durée de conservation","<ul><li>Compte et fiches : tant que le compte existe ou jusqu'à leur suppression.</li><li>Sessions et jetons : jusqu'à leur expiration.</li><li>Reçus et commandes : le temps nécessaire au contrôle et au support.</li><li>Journaux de sécurité, d'audit et de signalement : ils peuvent être conservés, détachés du compte, pour prévenir la fraude, résoudre un litige ou respecter une obligation légale.</li></ul>"],
["7. Suppression du compte","<p>Vous pouvez supprimer votre compte depuis la page Compte, après avoir saisi votre mot de passe et une phrase de confirmation. La suppression efface le compte, les fiches, images, annonces, paiements, reçus, favoris et avis associés. Les fiches et abonnements actifs prennent fin, sans remboursement de la période restante sauf obligation légale.</p>"],
["8. Vos droits","<p>Vous pouvez demander des informations sur le traitement, l'accès à vos données, leur rectification, vous opposer au traitement, demander leur suppression ou leur limitation lorsque c'est applicable, et retirer votre consentement. Une vérification d'identité peut être demandée. En cas de réclamation non résolue, vous pouvez saisir l'ANPDP, l'autorité nationale algérienne de protection des données personnelles.</p>"],
["9. Sécurité","<p>Mots de passe et jetons de session chiffrés par hachage, accès administrateur restreint, vérification de l'origine des opérations sensibles, traitement séparé des reçus de paiement et connexion HTTPS. Toute violation de données est contenue, évaluée et notifiée aux autorités et aux personnes concernées lorsque la loi l'exige.</p>"],
["10. Contact","<p>Vos demandes relatives à vos données peuvent être envoyées aux coordonnées indiquées dans l'application.</p>"]]}},
ar:{terms:{t:"شروط الاستخدام",s:[
["1. القبول","<p>باستخدامك Karti أو إنشاء حساب أو إرسال طلب مدفوع، فإنك توافق على هذه الشروط المتعلقة بك. إذا لم توافق عليها، فلا تنشئ حساباً ولا تستخدم الميزات التي تتطلبه.</p>"],
["2. التعريفات","<ul><li><b>المنصة</b>: الموقع، وتطبيق الويب القابل للتثبيت، وأي نسخة رسمية منشورة في متاجر التطبيقات.</li><li><b>المحتوى</b>: البطاقات والصور والإعلانات والتقييمات والبلاغات والنصوص والروابط التي ينشرها المستخدمون أو Karti.</li></ul>"],
["3. الزوار والحسابات","<p>يمكنك تصفح البطاقات العامة والبحث فيها دون حساب. الحساب ضروري لحفظ البطاقات أو ترك تقييم أو الإبلاغ عن محتوى أو إدارة بطاقة مهنية أو إعلان.</p><ul><li>يجب تقديم معلومات صحيحة والحفاظ على سرية كلمة المرور.</li><li>أنت مسؤول عن النشاط في جلستك إلى أن تبلغ عن اختراق أو تغيّر كلمة المرور.</li><li>انتحال الهوية والتلاعب بالتقييمات ممنوعان.</li></ul>"],
["4. البطاقات المهنية والاشتراكات","<p>Karti دليل مهني وليس طرفاً في الاتفاقات بين المهنيين وزبائنهم. صاحب البطاقة مسؤول عن صحة معلوماته وعن التراخيص اللازمة لنشاطه.</p><p>يمنح الاشتراك ظهوراً للبطاقة طوال المدة المعروضة قبل الدفع، ويُطبَّق السعر والمدة المعروضان وقت الطلب.</p>"],
["5. الإعلانات والدفع والاسترجاع","<ul><li>يجب أن تكون الإعلانات قانونية وصحيحة، وأن يملك المعلن حقوق الصور والنصوص والروابط. يحق لـ Karti رفض أي إعلان أو تعليقه.</li><li>يُراجَع كل دفع قبل تفعيل البطاقة، ولا يجمع Karti أرقام البطاقات البنكية كاملة ولا يحتفظ بها.</li><li>لا يُسترجع المبلغ عادةً بعد بدء مدة الظهور، إلا في حال خطأ واضح من Karti أو إذا فرض القانون ذلك.</li><li>حذف الحساب ينهي البطاقات والحملات فوراً دون استرجاع للمدة المتبقية.</li></ul>"],
["6. التقييمات والبلاغات والمحتوى","<p>تبقى مالكاً لمحتواك، وتمنح Karti ترخيصاً غير حصري ومجانياً طوال مدة وجوده لتخزينه وعرضه وفهرسته وتشغيل الخدمة.</p><ul><li>يجب أن يعكس التقييم تجربة حقيقية دون تشهير أو تهديد أو معلومات حساسة.</li><li>يُمنع المحتوى غير القانوني أو المضلل أو الذي يحرض على الكراهية أو الإباحي أو المخالف لحقوق الغير.</li><li>يمكن للفريق مراجعة البلاغات وإخفاء المحتوى وتحذير المستخدم وتقييد الحساب أو حذف المحتوى.</li></ul>"],
["7. أذونات التطبيق","<ul><li><b>الموقع</b>: يُطلب فقط للبحث القريب منك أو لإدخال عنوان المحل.</li><li><b>الإشعارات</b>: اختيارية.</li><li><b>الصور والكاميرا</b>: تُستخدم فقط عندما تختار رفع بطاقتك أو مسحها.</li><li>لا وصول إلى الميكروفون أو جهات الاتصال.</li></ul>"],
["8. المسؤولية","<p>يعرض Karti معلومات المهنيين كما قدّموها، ولا يضمن جودة عملهم ولا تنفيذ التزاماتهم. تحقّق من المهني قبل الدفع أو التعاقد.</p>"],
["9. القانون المطبق والنزاعات","<p>تخضع هذه الشروط للقانون الجزائري. تُسوّى النزاعات ودياً أولاً، ثم تُرفع أمام الجهات القضائية أو السلطات الجزائرية المختصة، ما لم ينص القانون على خلاف ذلك.</p>"],
["10. التواصل","<p>تُشغَّل الخدمة من طرف فريق إدارة Karti، وتجد معلومات التواصل داخل التطبيق.</p>"]]},
privacy:{t:"سياسة الخصوصية",s:[
["1. المسؤول والأغراض","<p>Karti هو المسؤول عن معالجة بياناتك. تُعالَج البيانات لتقديم الخدمة، وبموافقتك عندما تكون مطلوبة، ولحماية المنصة ومنع الاحتيال، وللوفاء بالالتزامات القانونية.</p><p>لا يبيع Karti بياناتك الشخصية ولا يؤجرها، ولا يستخدمها لتتبع إعلاني بين المواقع.</p>"],
["2. البيانات التي نجمعها","<ul><li>بيانات الحساب والهوية.</li><li>معلومات البطاقات المهنية المعروضة في الدليل.</li><li>المحتوى والتفاعلات: التقييمات والبلاغات والبطاقات المحفوظة.</li><li>بيانات الإعلانات والاشتراك.</li><li>الموقع، فقط إذا اخترت البحث القريب أو أدخلت عنواناً.</li><li>بيانات الأمان والجهاز: الجلسات وحدود المحاولات وسجلات الموافقة.</li><li>إحصاءات داخلية للاستخدام: المشاهدات والنقرات وطلبات التواصل.</li></ul>"],
["3. قراءة البطاقة بالذكاء الاصطناعي","<p>عند مسح بطاقتك، يمكن أن تُحلَّل الصورة بخدمة ذكاء اصطناعي بعد موافقتك، فقط لملء معلوماتك تلقائياً. يمكنك دائماً إدخال معلوماتك يدوياً.</p>"],
["4. الاستضافة ومقدمو الخدمات","<p>تعالج بياناتك جهات تقنية: قاعدة البيانات، وتخزين الصور، والاستضافة، وتأمين الاتصال، ورسائل الخدمة عبر البريد، والإشعارات بعد موافقتك، والخرائط عند الحاجة.</p>"],
["5. ملفات الارتباط والتخزين المحلي","<p>يُستخدم ملف ارتباط ضروري للجلسة عند تسجيل الدخول، ويحتفظ التخزين المحلي في متصفحك بتفضيلات الواجهة: اللغة والمفضلة والمسودات.</p>"],
["6. مدة الاحتفاظ","<ul><li>الحساب والبطاقات: طالما الحساب موجود أو إلى حين حذفها.</li><li>الجلسات والرموز: إلى حين انتهاء صلاحيتها.</li><li>الإيصالات والطلبات: المدة اللازمة للمراجعة والدعم.</li><li>سجلات الأمان والتدقيق والبلاغات: قد تُحفظ بعد فصلها عن الحساب لمنع الاحتيال أو حل النزاعات أو الوفاء بالتزام قانوني.</li></ul>"],
["7. حذف الحساب","<p>يمكنك حذف حسابك من صفحة الحساب بعد إدخال كلمة المرور وعبارة التأكيد. يحذف ذلك الحساب والبطاقات والصور والإعلانات والمدفوعات والإيصالات والمفضلة والتقييمات المرتبطة به. تنتهي البطاقات والاشتراكات النشطة دون استرجاع للمدة المتبقية، إلا إذا فرض القانون ذلك.</p>"],
["8. حقوقك","<p>يمكنك طلب معلومات عن المعالجة، والاطلاع على بياناتك وتصحيحها، والاعتراض على المعالجة، وطلب حذفها أو تقييدها عند الاقتضاء، وسحب موافقتك. قد يُطلب التحقق من هويتك. وفي حال شكوى لم تُحل، يمكنك اللجوء إلى السلطة الوطنية لحماية المعطيات ذات الطابع الشخصي (ANPDP).</p>"],
["9. الأمان","<p>تشفير كلمات المرور ورموز الجلسات، وتقييد وصول المشرفين، والتحقق من مصدر العمليات الحساسة، ومعالجة منفصلة لإيصالات الدفع، واتصال مؤمَّن عبر HTTPS. أي اختراق للبيانات يُحتوى ويُقيَّم ويُبلَّغ عنه للسلطات وللأشخاص المعنيين عندما يفرض القانون ذلك.</p>"],
["10. التواصل","<p>يمكنك إرسال طلباتك المتعلقة ببياناتك عبر معلومات التواصل الموجودة في التطبيق.</p>"]]}},
en:{terms:{t:"Terms of use",s:[
["1. Acceptance","<p>By using Karti, creating an account or sending a paid request, you accept the terms that apply to you. If you do not agree, do not create an account or use features that require one.</p>"],
["2. Definitions","<ul><li><b>Platform</b>: the website, the installable web app and any official version in app stores.</li><li><b>Content</b>: listings, images, ads, reviews, reports, text and links published by users or by Karti.</li></ul>"],
["3. Visitors and accounts","<p>You can browse and search public listings without an account. An account is needed to save listings, leave reviews, report content or manage a business listing or ad.</p><ul><li>Provide accurate information and keep your password confidential.</li><li>You are responsible for activity in your session until you report a breach or change your password.</li><li>Impersonation and review manipulation are prohibited.</li></ul>"],
["4. Business listings and subscriptions","<p>Karti is a directory and is not a party to agreements between professionals and their customers. Listing owners are responsible for the accuracy of their details and any licences their activity requires.</p><p>A subscription makes the listing visible for the period shown before payment. The price and duration shown at the time of the order apply.</p>"],
["5. Ads, payments and refunds","<ul><li>Ads must be lawful and accurate, and advertisers must own the rights to their images, text and links. Karti may reject or suspend ads.</li><li>Every payment is checked before the listing is activated. Karti does not collect or store full bank card numbers.</li><li>Payments are generally non-refundable once the listing period starts, except for a clear Karti error or where the law requires otherwise.</li><li>Deleting an account ends listings and campaigns immediately, with no refund for the remaining period.</li></ul>"],
["6. Reviews, reports and content","<p>You keep ownership of your content and grant Karti a non-exclusive, royalty-free licence, for as long as it exists, to store, display, index it and run the service.</p><ul><li>Reviews must reflect real experiences, without defamation, threats or sensitive information.</li><li>Illegal, misleading, hateful, pornographic or infringing content is prohibited.</li><li>The team may review reports, hide content, warn users, restrict accounts or delete content.</li></ul>"],
["7. App permissions","<ul><li><b>Location</b>: requested only for nearby search or entering a business address.</li><li><b>Notifications</b>: optional.</li><li><b>Photos and camera</b>: used only when you choose to upload or scan your card.</li><li>No access to the microphone or contacts.</li></ul>"],
["8. Liability","<p>Karti shows professionals' information as submitted and does not guarantee their work or the performance of their commitments. Check a professional before paying or signing anything.</p>"],
["9. Governing law and disputes","<p>These terms are governed by Algerian law. Disputes are first settled amicably, then brought before the competent Algerian courts or authorities, unless mandatory law provides otherwise.</p>"],
["10. Contact","<p>The service is operated by the Karti management team. Contact details are shown in the app.</p>"]]},
privacy:{t:"Privacy policy",s:[
["1. Controller and purposes","<p>Karti is the controller of your data. It is processed to provide the service, with your consent where required, to protect the platform and prevent fraud, and to meet legal obligations.</p><p>Karti does not sell or rent your personal data and does not use it for cross-site advertising tracking.</p>"],
["2. Data we collect","<ul><li>Account and identity data.</li><li>Business listing details shown in the directory.</li><li>Content and interactions: reviews, reports, saved listings.</li><li>Ad and subscription data.</li><li>Location, only when you choose nearby search or enter an address.</li><li>Security and device data: sessions, attempt limits, consent logs.</li><li>First-party usage statistics: views, clicks and contact actions.</li></ul>"],
["3. AI card reading","<p>When you scan your business card, the image may be analysed by an AI service, with your consent, only to pre-fill your details. You can always enter your details by hand.</p>"],
["4. Hosting and providers","<p>Your data is handled by technical providers for the database, image storage, hosting, connection security, service emails, notifications (after consent) and maps where needed.</p>"],
["5. Cookies and local storage","<p>A necessary session cookie is used for sign-in. Your browser's local storage keeps interface preferences: language, saved cards, drafts.</p>"],
["6. Retention","<ul><li>Account and listings: while the account exists or until deleted.</li><li>Sessions and tokens: until they expire.</li><li>Receipts and orders: as long as needed for review and support.</li><li>Security, audit and report logs: may be kept, separated from the account, to prevent fraud, resolve disputes or meet legal duties.</li></ul>"],
["7. Account deletion","<p>You can delete your account from the Account page after entering your password and a confirmation phrase. This removes the account and its listings, images, ads, payments, receipts, saved items and reviews. Active listings and subscriptions end, with no refund for the remaining time unless the law requires otherwise.</p>"],
["8. Your rights","<p>You may request information about processing, access to and correction of your data, object to processing, request deletion or restriction where applicable, and withdraw consent. Identity verification may be required. Unresolved complaints can be raised with the ANPDP, Algeria's national data protection authority.</p>"],
["9. Security","<p>Hashed passwords and session tokens, restricted admin access, source verification for sensitive operations, separate handling of payment receipts and HTTPS connections. Any breach is contained, assessed and reported to authorities and affected users where the law requires.</p>"],
["10. Contact","<p>Requests about your data can be sent using the contact details shown in the app.</p>"]]}}

function catMatches(q){
  const n=norm(q);if(!n)return SEC.map((s,i)=>({i,hit:null}));
  const words=n.split(/\s+/);
  return SEC.map((s,i)=>{const hay=norm(s.fr+" "+s.ar+" "+s.en+" "+s.kw);if(!words.every(w=>hay.includes(w)))return null;
    const kwHit=s.kw.split(" ").find(k=>norm(k).includes(words[0]));return{i,hit:norm(sName(s)).includes(n)?null:kwHit}}).filter(Boolean);
}
function subMatches(q){const n=norm(q);if(!n)return[];const ws=n.split(/\s+/);
  return SUBS.map((x,i)=>{const h=norm(x.fr+" "+x.ar);if(!ws.every(w=>h.includes(w)))return null;return{i,sc:norm(x.fr).startsWith(n)||norm(x.ar).startsWith(n)?0:norm(x.fr).includes(" "+n)||norm(x.ar).includes(" "+n)?1:2}}).filter(Boolean).sort((a,b)=>a.sc-b.sc).map(o=>o.i)}
