function rng(seed){let h=1779033703;for(const c of String(seed))h=Math.imul(h^c.charCodeAt(0),3432918353),h=h<<13|h>>>19;return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function build(w,s,sub){
  const S=SEC[s],sb=sub!=null?SUBS[sub]:null,key=sb?sub:"x";
  const mk=(n,i,x)=>{const id=`${w}-${s}-${key}-${i}`,r=rng(id);
    const rating=Math.round((3.9+r()*1.1)*10)/10,dist=Math.round((0.3+r()*7.5)*10)/10,count=Math.floor(8+r()*240);
    const pre=["05","06","07"][Math.floor(r()*3)],digits=Array.from({length:8},()=>Math.floor(r()*10)).join("");
    const act=Math.round(55+r()*45),score=Math.min(99,Math.round(rating*15+(10-dist)*2.8+act*.12));
    return Object.assign({id,w,s,n,rating,dist,count,act,tel:pre+digits,street:STREETS[Math.floor(r()*STREETS.length)],open:r()>.25,tpl:(typeof i==="number"?i:0)%4,score,sec:S},x||{})};
  let out=REAL.filter(c=>c.w===w&&c.s===s&&(!sb||c.sub===sub)).map(c=>mk(c.n,"r"+c.key,{img:c.img,tel:c.tel,street:c.st,real:true,subLabel:c.sub}));
  const names=sb?SUF.map(f=>[sb.fr+" "+f[0],sb.ar.replace(/^بيع (و )?/,"")+" "+f[1]]):S.n;
  if(out.length<3)out=out.concat(names.map((n,i)=>mk(n,i,sb?{subLabel:sub}:null)).slice(0,(out.length?4:6)-out.length));
  return out.sort((a,b)=>b.score-a.score);
}
const byId=id=>{const p=id.split("-");if(p.length<4)return null;return build(+p[0],+p[1],p[2]==="x"?null:+p[2]).find(b=>b.id===id)};
const telFmt=(t,mask)=>{const p=[t.slice(0,4),t.slice(4,6),t.slice(6,8),t.slice(8,10)];return mask?`${p[0]} ${p[1]} <s>${p[2]} ${p[3]}</s>`:p.join(" ")};

  if(b.design){if(b.design[0]==="d")return tplHTML(b);if(b.design[0]==="k")return b.side==="back"?backHTML(b):kHTML(b);if(b.side==="back")return backHTML(b);b=Object.assign({},b,{tpl:+b.design.slice(1),design:null})}

/* AI */
let aiRaf;
function runAI(){
  st.res=build(st.w,st.s,st.sub);st.total=Math.floor(220+rng(st.w+"t"+st.s+"-"+st.sub)()*1500);st.filter="ai";
  show("ai");
  $("#steps").innerHTML=t("steps").map(s=>`<div class="stp"><span class="b"></span><span>${fmt(s,{w:wName(st.w)})}</span><em></em></div>`).join("");
  const cv=$("#aiCanvas"),ctx=cv.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);
  const W0=cv.clientWidth,H0=cv.clientHeight;cv.width=W0*dpr;cv.height=H0*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=W0/2,cy=H0*.34,K=st.res.length,cols=st.res.map(b=>b.sec.c[1]),N=isDesk()?260:170,sc=isDesk()?1.5:1;
  const P=Array.from({length:N},(_,i)=>({x:Math.random()*W0,y:Math.random()*H0,vx:(Math.random()-.5)*.6,vy:(Math.random()-.5)*.6,a:Math.random()*Math.PI*2,r:i<K?4.5:1+Math.random()*1.8,hl:i<K,ring:(90+Math.random()*60)*sc}));
  const dur=matchMedia("(prefers-reduced-motion:reduce)").matches?1500:5600,t0=performance.now();
  cancelAnimationFrame(aiRaf);
  const stepEls=$$(".stp"),vals=[num(st.total),"0,3 – 8 "+t("km"),num(st.res.reduce((a,b)=>a+b.count,0))+" ★",K+" / "+num(st.total)];let last=-1;
  (function frame(now){
    const p=Math.min(1,(now-t0)/dur);ctx.clearRect(0,0,W0,H0);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,130*sc);g.addColorStop(0,`rgba(45,212,191,${.35+.15*Math.sin(now/300)})`);g.addColorStop(1,"rgba(45,212,191,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,130*sc,0,7);ctx.fill();
    ctx.strokeStyle="rgba(45,212,191,.12)";[60,110,160].forEach(r=>{ctx.beginPath();ctx.arc(cx,cy,r*sc+Math.sin(now/600+r)*3,0,7);ctx.stroke()});
    P.forEach((q,i)=>{
      if(p<.3){q.x+=q.vx;q.y+=q.vy}
      else if(p<.78){const ang=q.a+now/(q.hl?900:1600),R=q.hl?(70+i*9)*sc:q.ring;q.x+=(cx+Math.cos(ang)*R-q.x)*.06;q.y+=(cy+Math.sin(ang)*R*.9-q.y)*.06}
      else if(q.hl){const ang=q.a+now/500,R=60*sc*(1-(p-.78)/.22)+12;q.x+=(cx+Math.cos(ang)*R-q.x)*.15;q.y+=(cy+Math.sin(ang)*R-q.y)*.15}
      else{q.x+=(q.x-cx)*.04;q.y+=(q.y-cy)*.04}
      const al=q.hl?1:p>.78?Math.max(0,1-(p-.78)*5):.55;
      if(q.hl&&p>.45){ctx.strokeStyle=`rgba(45,212,191,.25)`;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(q.x,q.y);ctx.stroke()}
      ctx.fillStyle=q.hl?cols[i]:`rgba(255,255,255,${al})`;if(q.hl){ctx.shadowColor=cols[i];ctx.shadowBlur=14}
      ctx.beginPath();ctx.arc(q.x,q.y,q.r*(q.hl&&p>.3?1.2+.2*Math.sin(now/200+i):1),0,7);ctx.fill();ctx.shadowBlur=0;
    });
    ctx.fillStyle="#2DD4BF";ctx.beginPath();ctx.arc(cx,cy,10+3*Math.sin(now/250),0,7);ctx.fill();
    $("#pct").innerHTML=Math.round(p*100)+"<small>%</small>";
    const s=Math.min(3,Math.floor(p*4));if(s!==last){stepEls.forEach((e,j)=>{e.className="stp"+(j<s?" done":j===s?" act":"");if(j<s)e.querySelector("em").textContent=vals[j]});last=s;buzz(8)}
    if(p<1&&st.cur==="ai")aiRaf=requestAnimationFrame(frame);
    else if(st.cur==="ai"){stepEls.forEach((e,j)=>{e.className="stp done";e.querySelector("em").textContent=vals[j]});$("#flash").classList.add("go");buzz([20,30,40]);setTimeout(()=>{$("#flash").classList.remove("go");showResults()},420)}
  })(t0);
}
